[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-landing-reports"
version = "0.1.0"
description = "Self-hosted GA4 landing page reports and Slack alerts"
requires-python = ">=3.10"
dependencies = ["google-auth>=2.25,<3", "requests>=2.31,<3"]

[tool.setuptools.packages.find]
include = ["landing_reports*"]
